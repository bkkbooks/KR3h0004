  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0004_WYG_001-1a, image: WYG0812/WYG0812-0019c.png}
body:
  text: 貞觀公私畫史唐裴孝源撰叙曰虙犧氏受龍圖之後史為掌圖之官有體物之作盖以照逺顯幽侔列羣象自𤣥黄萌始方圖辯正有形可明之事前賢成建之跡遂追而寫之至虞夏殷周及秦漢之代皆有史掌雖遭罹播散而終有所歸及吴魏晉宋世多竒人皆心目相授斯道始興其於忠臣孝子賢愚美惡莫不圖之屋壁以訓将来或想功烈扵千年聆英威扵百代乃心存懿迹黙匠儀形其餘風化幽微感而遂至飛游騰竄騐之目前皆可圖畫且夫藝有精深學有疎密前賢品録益多其流大唐漢王元昌天植其材心専物表含運覃思六法俱全隨物成形萬類無失每燕時暇日多與其流商確精奥以余耿尚常賜討論遂命魏晉以来前賢遺跡所存及品格髙下列為先後起於髙貴鄉公終於大唐貞觀十三年祕府及佛寺并私家所蓄其二百九十八卷屋壁四十七所目為貞觀公私畫録又集新録官庫畫總二百九十八卷三百三十卷是隋室官十三卷是左僕射蕭瑀進二十卷楊素家得三卷許善心進十卷髙平縣行書佐張氏所獻四卷禇安福進近十八卷先在祕府亦無所得人名並有天和年月其間有二十三卷恐非晉宋人真跡多當時工人所作後人彊題名氏時貞觀十三年八月望日序中書舍人裴孝源宋眀帝像宋景和像豫章王像建平王像江夏王像零陵王像王太宰像羊𤣥保像江智淵像顧慶像梁太清目所無孫髙麗像孝武功臣像勲臣像張彦逺名畫記又有王榮像十一人圖劉季之像蕭史圖服乗箴圖鸂鵣圖右十三卷是陸探微真跡隋朝官本建安山陽二王像沈曇慶醉像麻超之徐僧寳像梁太清目中無靈臺寺瑾統像毛詩新臺圖蔡姬蕩舟圖梁太清目中無劉亮騧馬圖髙麗赭白馬圖蟬雀圖鬬鴨圖梁太清目中無獼猴圖右十二卷並摹寫本非陸真跡與前十三卷共二十五卷題作陸探微畫隋朝官本亦有梁陳題記新豐放雞犬圖二疏圖黄河流勢圖盜跖圖張彦逺名畫記又有於陵子黔婁夫妻像右四卷魏髙貴鄉公畫隋朝官本梁太清目不載毛詩北風圖梁太清作謝稚畫毛詩黍離圖梁太清止有此圖卞荘刺二虎圖吴王舟師圖列女圖張彦逺名畫記又有小列女圖楞嚴七佛圖右五卷衛協畫隋朝官本史記烈士圖息徒蘭圃圖洛神賦圖已上三卷梁太清目中所有餘皆所無穆天子燕瑶池圖漢武回中圖畋游圖梁太清目有㳺獵圖恐是此瀛洲神仙圖雜人風土圖右八卷晉明帝畫隋朝官本張彦遠名畫記又有禹㑹塗山圖殷湯伐桀圖洛中貴戚圖畫列女濠梁圖一卷梁太清目作兩卷并載下二卷十弟子圖輕車迅邁圖孝經圖梁太清目此下並不載狩河陽圖秦王游海圖汾陽醮鼎圖楚令尹泣兩岐蛇圖㳺仙圖孟母圖洛陽平門翻車圖右十一卷謝稚畫隋朝官本王僧綽像懐香圖蟬雀圖雜竹様上四卷梁太清目無孫公命将圖陸士衡詩㑹圖王謝諸賢像名臣像刺虎圖小兒戲鵝圖云昭明太子像右十卷顧景秀畫六卷隋朝官本山陽七賢圖梁太清目中無醉客圖刀㦸戲圖騎馬圖一卷一云四卷右四卷毛惠逺畫隋朝官本張彦逺名畫記又有葉公好龍圖併除圖一卷梁太清目止有此卷釋迦十弟子圖胡僧像剡中溪谷村墟圖右四卷毛惠秀畫隋朝官本豫章王燕賔圖梁太清目中有維摩詰變相圖天女像一本作天王像東晉髙僧像三卷無名真貌一卷三人冠武弁題云袁蒨畫有梁太清年月博奕圖三龍圖一卷右七卷袁蒨畫並是梁朝官本有太清年月號張彦逺名畫記又有蒼梧圖朝臣像吴中舟行圖少年行樂圖上二卷太清目所有右三卷劉填畫隋朝官本豫章王像唐居人馬圖太清所無右二卷蘧師珍畫梁朝官本巢由洗耳圖獅子擊象圖云宗炳畫右二卷題云嵇康畫未詳隋朝官本康畫太清目中所不載講學圖右一卷蔡邕畫隋朝官本有晉宋梁陳年月印記張彦逺名畫記又有小列女圖邕畫太清目所不載吳季札像嚴君平賣卜圖兩京圖右三卷楊倄畫隋朝官本有晉明帝題記周穆王八駿圖服乗箴圖七命圖金谷園圖已上太清所無燕氏送荆軻圖王濬弋船圖田家社㑹圖梵僧圖右八卷史道碩畫隋朝官本張彦逺名畫記田家十一月圖尚平子圖董威輦詩圖嵇阮像胡人獻獸圖漁父圖十九首詩圖五天羅漢像杜征南人物圖吴中溪山邑居圖黒獅子圖名馬圖右十一卷戴逵畫隋朝官本此下脱司馬宣王像麻紙白畫謝安像麻紙白畫劉牢之像桓𤣥圖列仙圖上五卷梁太清目所有唐僧㑹像沅湘像三天女像八國分舍利圖木雁圖水府圖廬山圖摴蒲㑹圖行龍圖虎嘯圖虎豹雜鷙圖鳬雁水洋圖右十七卷顧愷之畫九卷隋朝官本豫章王像宋竟陵王像勲賢圖禇淵袁粲像張興像天竺僧像二卷射雉圖上八卷梁太清目所不載洛中車馬圖二卷越中風俗圖二卷髙麗鬬鴨圖一卷右十三卷顧寳光畫隋朝官本張彦逺名畫記又有鬬雞圖龍頭様四卷四頭青溪側坐赤龍盤赤龍圖二卷南海監牧進十種馬圖夷子蠻獸樣一卷已上五卷皆太清目中所無右五卷曹不興畫二卷隋朝官本九州名山圖梁太清目所有朝陽谷神風水圖秦始皇東游圖右三卷戴勃畫隋朝官本立釋迦像太清目無周盤龍像右二卷陸綏畫黄帝昇仙圖太清目所有張子平西京賦圖梁翼人馬圖右三卷史文敬畫梁朝官本孫倬像漁父圖梁太清目所有王羲之像右三卷史藝畫虎豹圖孔雀鸚鵡圖上一卷太清目所有右二卷陶景真畫隋朝官本潁川先賢圖得于楊素家惠持師像問禮圖永嘉屋邑圖已上皆梁太清目中所有右四卷宗炳畫隋朝官本殷洪像太清目所有白馬寺寳臺様右二卷姚曇度畫南朝貴戚圖車馬圖駱簡像牛車圖山隂王像右五卷月長生畫蘇門先生圖一卷名臣像一卷此卷梁太清目所無右二卷濮萬年畫維摩詰變相圖一巻梁太清目所無右一卷張墨畫隋朝官本蘇武圖㳺仙圖右二卷蔡斌畫悉逹太子納妃圖靈嘉塔様右二卷張善果畫一卷隋朝官本善果畫太清目所不載或云善果僧繇之子李源序云以品格髙下豈宜處此穆天子八駿圖息媯圖一作史道碩畫右二卷史粲畫梁太清目所無朱買臣圖太清目無列女傳仁智圖列女傳貞節圖太清作謝稚畫右三卷陳公恩畫一卷是隋朝官本王獻之像右一卷鍾宗之畫或作宗斐敗春圖梁太清目無右一卷王殿畫隋朝官本安期先生圖右一卷謝赫畫梁太清目無吴山圖楚人祠鬼圖右二卷夏侯瞻畫梁太清目作馬瞻疑非是二卷皆無藉田圖一卷全幅長三丈右一卷章惬伯畫隋朝官本或作繼伯太清目無渥洼馬圖一卷孝子屏風一卷太清作𢎞景畫右二卷范懐賢畫隋朝官本或作懐堅文殊像一卷游春苑圖二巻芙蓉湖醮鼎圖一卷鹿圖一卷鸛鶴弄陂澤圖一卷上六卷太清目所無右六卷梁元帝畫並有題跋印記張彦逺名畫記又有職貢圖職貢圖三卷小兒戲鴨圖一卷右四卷江僧實畫隋朝官本亦有梁陳年號題梁太清目所載張彦逺名畫記又有御臨軒圖五天人様二卷九子魔圖一卷丁貴人彈曲項琵琶圖一卷右四卷解倩畫一卷是隋朝官本太清目無弗林圖人物器様二卷鬼神様二卷外國雜獸二卷右六卷西域僧迦佛陀畫並得楊素家漢武射蛟圖一卷吴王格虎圖一卷羊鴉仁躍馬圖一卷行道天王像一卷維摩詰像一卷寳詰像一卷摩衲仙人像一卷朱异像一卷梁宫人射雉圖一卷醉僧圖二卷詠梅圖一卷横泉鬬龍一卷雜人馬兵刀圖一卷昆明二龍圖一卷青溪宫水恠圖四卷已上諸畫太清目皆無右十九卷張僧繇畫九卷隋朝官本張彦逺名畫記又有梁武帝像定光像田舍兒舞圖楞伽㑹圖一卷寳積變相圖一卷右二卷張儒童畫僧繇之子太清目不載支道林像一卷右一卷聶松畫隋朝官本梁太清目不載斛律金像一卷鄴中百戲圖一卷北齊貴戚游苑圖一卷雜宫苑人物屏風本一卷右四卷楊子華畫隋朝官本自子華下皆北地畫手或云梁後改太清目中不載齊神武臨軒對武騎圖二卷慕容紹宗像一卷弋獵圖一卷斛律明月像一卷盧思道像一卷名馬様一卷右七卷曹仲達畫六卷是隋朝官本周明帝畋游圖一卷彌勒變相圖一卷雜臺閣様一卷隋文帝上廐馬圖一卷農家田舍圖一卷右五卷董伯仁畫一卷是隋朝官本隋文帝入佛空像一卷阿育王像一卷楊素像一卷賀若弼像一卷陳叔英像一卷擒明盧明月像圖一卷洛中人物車馬圖様一卷北齊畋游圖一卷貴威屏風様二卷張彦逺名畫記又有游春苑圖右十卷鄭法士畫一卷是隋朝官本雜物變相二卷豆盧寜像一卷隋朝正㑹圖一卷幸洛圖一卷貴戚游燕圖一卷右六卷楊契丹畫一卷是隋朝官本法華變相一卷南郊圖一卷長安車馬人物圖一卷雜宫苑圖一卷弋獵圖一卷王世充像一卷右六卷展子䖍畫張彦逺名畫記又有王母圖朱買臣覆水圖齊後主幸晉陽之圖美人詩意圖一卷屋宇様一卷雜鬼神像三卷右五卷孫尚子畫黄帝戰涿鹿圖一卷姜源圖一卷太清目作蘧師珍畫禹貢圖二卷燕太子丹圖一卷蓄史圖一卷孫氏水戰圖一卷五岳真形圖一卷紀年詩意圖一卷雜鬼神樣二卷右十一卷皆甚精竒隋朝以来私家搜訪所得内三卷近陸探微先無題記可考列女傳仁智圖獅子圖畏獸圖已上三卷梁太清目所有魚龍相戲圖吳楚放牧圖村社㑹集圖右六卷王廙畫隋朝官本本作戴逵下脱略補此張彦逺名畫記又有獅子擊象圖犀兒圖已前縂二百八十一卷并無名畫十二卷計二百九十三卷晉瓦官寺有顧愷之張僧繇畫壁在江寜宋法王寺顧駿之畫在永嘉晉龍寛寺史道碩畫在江陵晉本紀寺史道碩畫在郯中齊王觀寺沈摽畫在㑹稽魏白雀寺董伯仁畫在汝州魏北宣寺楊子華畫在鄴中梁定林寺解倩畫在江寜梁惠聚寺張僧繇畫在江陵梁延祚寺張僧繇畫在江陵梁長慶寺江僧寳畫在江陵梁何后寺陸整畫在江寜梁光相寺丁光畫在江陵梁陟屺寺張善果畫在江陵梁髙座寺張僧繇畫在江寜梁景公寺江僧寳畫在江寜梁開善寺張僧繇畫在江寜梁草堂寺焦寳顥畫在江寜梁報恩寺張儒童畫在㑹稽梁資徳寺解倩畫在延陵梁天皇寺張僧繇解倩畫在江陵北齊大定寺劉殺鬼畫在鄴中周海覺寺董伯仁鄭法士畫在固州陳棲霞寺張善果畫在江寜陳興聖寺張儒童畫在江都陳逮善寺陸整畫在江都陳静樂寺張善果畫在江都陳東安寺張儒童展子䖍畫在江都改為常樂寺陳終聖寺董伯仁畫在江陵隋西禪寺孫尚子畫在長安隋東禪寺鄭徳文畫在長安隋惠日寺張善果畫在江都隋永福寺楊子華畫在長安隋靈寳寺展子䖍鄭法士畫在長安隋光眀寺田僧亮展子䖍鄭法士楊契丹畫在長安隋敬愛寺孫尚子畫在洛陽隋天女寺展子䖍畫在洛陽隋雲花寺展子䖍畫在洛陽隋清禪寺陳善見畫在長安隋光發寺董伯仁畫在洛陽隋興善寺劉烏畫在長安隋皈依寺田僧亮畫在長安隋浄域寺張僧繇畫自江外移来亦有孫尚子畫在長安隋恩覺寺袁子昻畫在洛陽隋空觀寺袁子昻畫在長安隋隆法寺范長夀張孝師畫在長安隋寳刹寺鄭法士楊契丹畫在長安右寺四十七所並是名工真跡今東都古畫尚多未得檢閲爾今集檢前蹤取其法度兼之巧思維二閻楊陸迥出常表袁張兩家父子亦得居其次閻本師祖張公可謂青出扵藍矣至扵人物衣冠車馬臺閣並得南北之妙楊張父子亦謂世不乏賢博陵大安誠曰難兄難弟之學者陳善見王知慎之流萬得其一固未及扵風神尚汲汲扵形似今人所蓄多是陳王寫搨都非楊鄭之真筆每将真玩深宜精别也貞觀公私畫史
