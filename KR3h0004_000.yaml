body:
  text: 提要貞觀公私畫史藝術類一書畫之屬臣等謹案貞觀公私畫史一卷唐裴孝源撰孝源里貫未詳卷首有貞觀十三年八月自序結銜題中書舍人按唐書藝文志有裴孝源畫品録一卷注曰中書舍人與此序合然注又曰記貞觀顯慶年事而此書序中則稱大唐漢王元昌毎燕時暇日多與其流商確精奥以予耿尚嘗賜討論遂命取魏晉以來前賢遺蹟所存及品格髙下列為先後起扵髙貴鄉公終於大唐貞觀十三年秘府及佛寺并私家所蓄共二百九十八卷屋壁四十七所為貞觀公私畫録云云與注所言絶不相符考張彦逺名畫録引孝源畫録最多皆此書所無盖孝源别有一書記貞觀顯慶間畫家品第如謝赫古畫品録之例非此書也又序稱髙貴鄉公以下而此本所列乃以陸探微為首反居其前疑𫝊寫之誤又序稱止於貞觀十三年而此本所列皆隋代收蔵官本其畫壁亦終於楊契丹均不可解考其序末稱又集新録官庫畫總二百九十八卷三百三十卷是隋室官物十三卷是左僕射蕭瑀進二十卷是楊素家得三十卷許善心進十卷髙平縣行書佐張氏所獻四卷禇安福進十八卷先在秘府亦無所得人名並有天和年月其間有二十三卷恐非晉宋人真迹云云其文重沓不明疑𫝊寫有誤推其大意似尚有新録今佚之耳書中皆前列晝名後列作者之名以梁太清目所有梁太清目所無分注於下太清目既不可見則考隋以前古畫名目者莫古於是亦賞鑒家之祖本矣書譜臣等謹案書譜一卷唐孫過庭撰竇臮述書賦注曰孫過庭字䖍禮富陽人右衛胄曹叅軍張懐瓘書斷則云孫䖍禮字過庭陳留人官至率府録事叅軍二人俱相距不逺而所記名字爵里不同殆與舊唐書稱房喬字元齡新唐書稱房元齡字喬者同一訛異疑唐人多以字行故各據所聞不能畫一也是書篇末自題垂拱三年蓋武后時作書斷謂之筆意論然世傳石刻乃其手迹篇中自稱名曰書譜則作書譜為是矣過庭之書頗為竇臮述書賦所詆然自宋以来皆推能品不以臮言為然張懐瓘推奬是書亦稱其深得㫖趣故操翰者奉為指南然過庭自稱撰為六篇分為兩卷此本乃止一篇疑全書已佚流傳真迹僅存其總序之文以前賢緒論姑存以見一斑而仍題其全書之名耳然微言奥義已足見其大凡矣乾隆四十五年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
